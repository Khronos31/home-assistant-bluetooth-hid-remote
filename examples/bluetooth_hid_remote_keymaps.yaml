# Copy this file to /config/bluetooth_hid_remote_keymaps.yaml and reload the
# integration's options form. Usage keys are canonical HID Usage Page:Usage ID
# pairs written in hexadecimal.
profiles:
  my_android_remote:
    extends: android_tv
    namespace: android
    mappings:
      "07:0058": DPAD_CENTER
      "0C:008D": GUIDE
      "0C:0223": HOME

  my_hid_remote:
    extends: hid
    namespace: hid
    mappings:
      "0C:008D": PROGRAM_GUIDE
