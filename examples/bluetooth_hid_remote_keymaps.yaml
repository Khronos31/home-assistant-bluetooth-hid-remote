# Copy this file to /config/bluetooth_hid_remote_keymaps.yaml and reload the
# integration's options form. Usage keys are canonical HID Usage Page:Usage ID
# pairs written in hexadecimal.
profiles:
  my_android_remote:
    extends: android_tv
    namespace: android
    mappings:
      "07:0058": DPAD_CENTER
      # Example device-specific streaming buttons.
      "00FF:00A1": VIDEO_APP_1
      "00FF:00A2": VIDEO_APP_2
      "00FF:00A3": VIDEO_APP_3
      "00FF:00A4": VIDEO_APP_4
      "0C:008D": GUIDE
      "0C:0223": HOME

  my_hid_remote:
    extends: hid
    namespace: hid
    mappings:
      "0C:008D": PROGRAM_GUIDE
